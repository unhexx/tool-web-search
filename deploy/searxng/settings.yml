# Локальный SearXNG для tool-web-search.
# JSON обязателен: клиент ходит в /search?format=json.
use_default_settings: true

server:
  secret_key: "tool-web-search-local-dev-not-ultrasecretkey"
  limiter: false
  public_instance: false
  image_proxy: false
  method: "GET"

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json

