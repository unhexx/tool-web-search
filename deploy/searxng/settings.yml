# Локальный SearXNG для tool-web-search.
# JSON обязателен: клиент ходит в /search?format=json.
use_default_settings: true

server:
  # Плейсхолдер. Живой ключ пишет deploy/searxng/init-settings.sh в volume.
  secret_key: "__SEARXNG_SECRET_KEY__"
  limiter: false
  public_instance: false
  image_proxy: false
  method: "GET"

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json

