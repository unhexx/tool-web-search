[project]
name = "tool-web-search"
version = "1.1.1"
description = "Local web_search over corpus + optional self-hosted SearXNG"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Evgeniy Chistyakov", email = "unhandled@exception.expert" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]

[project.scripts]
tool-web-search = "tool_web_search.server:main"
tool-web-search-loop = "tool_web_search.loop:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
py-modules = ["tool_http"]
