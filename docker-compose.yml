name: tool-web-search

# По умолчанию — только локальный корпус (TOOL_OFFLINE=1).
# Живой метапоиск:
#   docker compose --profile searxng up -d --build
#   TOOL_OFFLINE=0 SEARXNG_URL=http://searxng:8080

services:
  tool:
    build: .
    image: tool-web-search:local
    ports:
      - "127.0.0.1:8094:8094"
    environment:
      TOOL_HOST: "0.0.0.0"
      TOOL_PORT: "8094"
      TOOL_TOKEN: "${TOOL_TOKEN:-local}"
      TOOL_OFFLINE: "${TOOL_OFFLINE:-1}"
      WEB_CORPUS: /app/corpus/index.json
      SEARXNG_URL: "${SEARXNG_URL:-}"
      WEB_CONTEXT_BUDGET_CHARS: "${WEB_CONTEXT_BUDGET_CHARS:-}"
    volumes:
      - ./corpus:/app/corpus:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 256m
    pids_limit: 128
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8094/healthz')"]
      interval: 20s
      timeout: 5s
      start_period: 10s
      retries: 5

  searxng:
    profiles: ["searxng"]
    image: docker.io/searxng/searxng:latest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:8080/
    entrypoint: ["/usr/bin/sh", "/usr/local/bin/init-settings.sh"]
    volumes:
      - searxng_data:/etc/searxng
      - ./deploy/searxng/settings.yml:/usr/local/share/tool-web-search/settings.yml:ro
      - ./deploy/searxng/init-settings.sh:/usr/local/bin/init-settings.sh:ro
      - ./deploy/searxng/limiter.toml:/etc/searxng/limiter.toml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 5
    security_opt:
      - "no-new-privileges:true"
    restart: unless-stopped

volumes:
  searxng_data:

