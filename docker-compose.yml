name: tool-web-search

services:
  tool:
    build: .
    image: tool-web-search:local
    ports:
      - "127.0.0.1:8094:8094"
    environment:
      TOOL_HOST: "0.0.0.0"
      TOOL_PORT: "8094"
      TOOL_TOKEN: "${TOOL_TOKEN:-local}"
      TOOL_OFFLINE: "${TOOL_OFFLINE:-1}"
      WEB_CORPUS: /app/corpus/index.json
      SEARXNG_URL: "${SEARXNG_URL:-}"

    volumes:
      - ./corpus:/app/corpus:ro
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 256m
    pids_limit: 128
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8094/healthz')"]
      interval: 20s
      timeout: 5s
      start_period: 10s
      retries: 5
